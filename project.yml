name: iSpoonFit
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    # Shared by the app and its widget, which must always match.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: S769436W24
    CODE_SIGN_STYLE: Automatic
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  iSpoonFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iSpoonFit
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: iSpoonFitWidget
    entitlements:
      path: iSpoonFit/iSpoonFit.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.dev.ividi.ispoonfit
    postBuildScripts:
      - name: Register sign-in URL schemes
        basedOnDependencyAnalysis: false
        # Declared as an input so the step runs after Xcode writes Info.plist.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: sh "$SRCROOT/scripts/register-url-schemes.sh"
    info:
      path: iSpoonFit/Info.plist
      properties:
        CFBundleDisplayName: iSpoonFit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # English here; the Portuguese text is in pt-PT.lproj/InfoPlist.strings.
        NSHealthUpdateUsageDescription: iSpoonFit saves each finished session to the Health app as a workout.
        NSHealthShareUsageDescription: iSpoonFit only saves workouts and never reads your health data.
        # Only standard HTTPS (Firebase): exempt, so TestFlight skips the
        # export-compliance question on every build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ispoonfit
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  iSpoonFitWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iSpoonFitWidget
      - path: iSpoonFit/Shared
    entitlements:
      path: iSpoonFitWidget/iSpoonFitWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ividi.ispoonfit
    info:
      path: iSpoonFitWidget/Info.plist
      properties:
        CFBundleDisplayName: iSpoonFit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ispoonfit.widget
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  iSpoonFitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iSpoonFitTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: iSpoonFit
schemes:
  iSpoonFit:
    build:
      targets:
        iSpoonFit: all
        iSpoonFitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iSpoonFitTests
    archive:
      config: Release

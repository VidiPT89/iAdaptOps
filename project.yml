name: iSpoonFit
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  iSpoonFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iSpoonFit
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: iSpoonFit/iSpoonFit.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    postBuildScripts:
      - name: Register sign-in URL schemes
        basedOnDependencyAnalysis: false
        # Declared as an input so the step runs after Xcode writes Info.plist.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: sh "$SRCROOT/scripts/register-url-schemes.sh"
    info:
      path: iSpoonFit/Info.plist
      properties:
        CFBundleDisplayName: iSpoonFit
        # Only standard HTTPS (Firebase): exempt, so TestFlight skips the
        # export-compliance question on every build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ispoonfit
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S769436W24
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  iSpoonFitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iSpoonFitTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: iSpoonFit
schemes:
  iSpoonFit:
    build:
      targets:
        iSpoonFit: all
        iSpoonFitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iSpoonFitTests
    archive:
      config: Release
